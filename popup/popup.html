<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page to Summary Speech</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="shine"></span>
    </div>

    <div class="shell">
      <header class="brand glass-card brand-card">
        <div class="brand-row">
          <div class="brand-glyph" aria-hidden="true">
            <span class="glyph-wave"></span>
          </div>
          <div>
            <p class="brand-mark">Page to Summary Speech</p>
            <p class="brand-sub" data-i18n="brandSub">
              ページを要約して読み上げ
            </p>
          </div>
        </div>
      </header>

      <section class="panel glass-card">
        <label class="field">
          <span class="field-label" data-i18n="language">言語</span>
          <span class="select-wrap">
            <select id="locale">
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ko">한국어</option>
            </select>
            <span class="chevron" aria-hidden="true"></span>
          </span>
        </label>

        <label class="field">
          <span class="field-label" data-i18n="apiKey">OpenAI API キー</span>
          <div class="key-row">
            <input
              id="apiKey"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="sk-..."
            />
            <button
              id="toggleKey"
              type="button"
              class="icon-btn"
              data-i18n-aria-label="showApiKey"
              data-i18n-title="show"
              aria-label="APIキーを表示"
              aria-pressed="false"
              title="表示"
            >
              <svg
                class="icon-eye"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                class="icon-eye-off"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 3l18 18" />
                <path d="M10.6 10.6a3 3 0 1 0 4.2 4.2" />
                <path
                  d="M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-2.1 3M6.7 6.8C4.6 8.2 3.1 10.1 2 12c0 0 3.5 7 10 7 1.9 0 3.5-.5 4.9-1.2"
                />
              </svg>
            </button>
          </div>
        </label>

        <label class="field">
          <span class="field-label" data-i18n="voice">音声</span>
          <span class="select-wrap">
            <select id="voice">
              <option value="coral">coral</option>
              <option value="marin">marin</option>
              <option value="cedar">cedar</option>
              <option value="nova">nova</option>
              <option value="alloy">alloy</option>
              <option value="ash">ash</option>
              <option value="ballad">ballad</option>
              <option value="echo">echo</option>
              <option value="fable">fable</option>
              <option value="onyx">onyx</option>
              <option value="sage">sage</option>
              <option value="shimmer">shimmer</option>
              <option value="verse">verse</option>
            </select>
            <span class="chevron" aria-hidden="true"></span>
          </span>
        </label>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="prompt" data-i18n="prompt"
              >要約プロンプト</label
            >
            <button
              id="resetPrompt"
              type="button"
              class="linkish"
              data-i18n="resetPrompt"
            >
              初期値に戻す
            </button>
          </div>
          <textarea
            id="prompt"
            rows="1"
            spellcheck="false"
            data-i18n-placeholder="promptPlaceholder"
            placeholder="要約の指示を入力"
          ></textarea>
        </div>

        <button id="run" type="button" class="primary" data-i18n="run">
          要約して読み上げ
        </button>
      </section>

      <section class="progress-panel glass-card" id="progressPanel" hidden>
        <ol class="steps" id="steps" aria-live="polite">
          <li class="step" data-step="extract">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepExtract">本文を抽出中</span>
          </li>
          <li class="step" data-step="summarize">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepSummarize"
              >回答を生成中</span
            >
          </li>
          <li class="step" data-step="speech">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepSpeech">音声を生成中</span>
          </li>
        </ol>
        <div id="status" class="status" hidden>
          <span class="status-icon" aria-hidden="true"></span>
          <span id="statusText" class="status-text"></span>
        </div>
      </section>

      <section class="summary-panel glass-card">
        <details id="summaryDetails" class="summary-details">
          <summary class="summary-toggle">
            <span data-i18n="summary">要約</span>
            <span class="chevron" aria-hidden="true"></span>
          </summary>
          <p id="summary" class="summary empty" data-i18n-empty="summaryEmpty">
            まだありません
          </p>
        </details>
      </section>

      <section class="player-panel glass-card" id="playerPanel">
        <div class="player-header">
          <h2 data-i18n="player">読み上げ</h2>
          <span id="playerBadge" class="player-badge">待機中</span>
        </div>

        <div
          class="player glass-inset"
          id="playerControls"
          aria-disabled="true"
        >
          <button
            id="playPause"
            type="button"
            class="play-btn"
            disabled
            data-i18n-aria-label="play"
            aria-label="再生"
          >
            ▶
          </button>

          <div class="timeline">
            <input
              id="seek"
              type="range"
              min="0"
              max="0"
              value="0"
              step="0.1"
              disabled
            />
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <label class="speed-field">
            <span class="field-label" data-i18n="speed">速度</span>
            <span class="select-wrap">
              <select id="speed">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2">2x</option>
              </select>
              <span class="chevron" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
