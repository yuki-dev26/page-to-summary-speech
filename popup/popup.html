<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page to Summary Speech</title>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="shine"></span>
    </div>

    <div class="shell">
      <header class="brand glass-card brand-card">
        <div class="brand-row">
          <div class="brand-glyph" aria-hidden="true">
            <span class="glyph-wave"></span>
          </div>
          <div class="brand-text">
            <p class="brand-mark">Page to Summary Speech</p>
            <p class="brand-sub" data-i18n="brandSub">
              ページを要約して読み上げ
            </p>
          </div>
        </div>
      </header>

      <section class="player-panel glass-card" id="playerPanel">
        <div class="player-header">
          <h2 data-i18n="player">読み上げ</h2>
          <span id="playerBadge" class="player-badge">待機中</span>
        </div>

        <div
          class="player glass-inset"
          id="playerControls"
          aria-disabled="true"
        >
          <button
            id="playPause"
            type="button"
            class="play-btn"
            disabled
            data-icon="play"
            data-i18n-aria-label="play"
            aria-label="再生"
          >
            ▶
          </button>

          <div class="timeline">
            <input
              id="seek"
              type="range"
              min="0"
              max="0"
              value="0"
              step="0.1"
              disabled
            />
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <label class="speed-field">
            <span class="field-label" data-i18n="speed">速度</span>
            <span class="select-wrap" data-custom-select>
              <select id="speed">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2">2x</option>
              </select>
              <span class="chevron" aria-hidden="true"></span>
            </span>
          </label>
        </div>

        <button id="run" type="button" class="primary" data-i18n="run">
          要約して読み上げ
        </button>
      </section>

      <section class="progress-panel glass-card" id="progressPanel" hidden>
        <ol class="steps" id="steps" aria-live="polite">
          <li class="step" data-step="extract">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepExtract">本文を抽出中</span>
          </li>
          <li class="step" data-step="summarize">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepSummarize"
              >回答を生成中</span
            >
          </li>
          <li class="step" data-step="speech">
            <span class="step-dot"></span>
            <span class="step-label" data-i18n="stepSpeech">音声を生成中</span>
          </li>
        </ol>
        <div id="status" class="status" hidden>
          <span class="status-icon" aria-hidden="true"></span>
          <span id="statusText" class="status-text"></span>
        </div>
      </section>

      <section class="summary-panel glass-card">
        <details id="summaryDetails" class="summary-details">
          <summary class="summary-toggle">
            <span data-i18n="summary">要約結果</span>
            <span class="chevron" aria-hidden="true"></span>
          </summary>
          <p id="summary" class="summary empty" data-i18n-empty="summaryEmpty">
            まだありません
          </p>
        </details>
      </section>

      <section class="panel glass-card">
        <details class="settings-details">
          <summary class="settings-toggle">
            <span data-i18n="settings">設定</span>
            <span class="chevron" aria-hidden="true"></span>
          </summary>

          <div class="settings-body">
            <label class="field">
              <span class="field-label" data-i18n="language">言語</span>
              <span class="select-wrap" data-custom-select>
                <select id="locale">
                  <option value="ja">日本語</option>
                  <option value="en">English</option>
                  <option value="zh-CN">简体中文</option>
                  <option value="zh-TW">繁體中文</option>
                  <option value="ko">한국어</option>
                </select>
                <span class="chevron" aria-hidden="true"></span>
              </span>
            </label>

            <div class="field">
              <span class="field-label" data-i18n="theme">テーマ</span>
              <div
                class="theme-switch"
                role="group"
                data-i18n-aria-label="theme"
                aria-label="テーマ"
              >
                <button
                  id="themeLight"
                  type="button"
                  class="theme-option"
                  data-theme-value="light"
                  aria-pressed="true"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="4" />
                    <path
                      d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    />
                  </svg>
                  <span data-i18n="themeLight">ライトモード</span>
                </button>
                <button
                  id="themeDark"
                  type="button"
                  class="theme-option"
                  data-theme-value="dark"
                  aria-pressed="false"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z" />
                  </svg>
                  <span data-i18n="themeDark">ダークモード</span>
                </button>
              </div>
            </div>

            <div class="field">
              <div class="field-label-inline">
                <label class="field-label" for="apiKey" data-i18n="apiKey"
                  >OpenAI API キー</label
                >
                <a
                  class="label-link"
                  href="https://platform.openai.com/api-keys"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n-aria-label="openApiKeys"
                  data-i18n-title="openApiKeys"
                  aria-label="APIキーを取得"
                  title="APIキーを取得"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M14 4h6v6" />
                    <path d="M10 14L20 4" />
                    <path
                      d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"
                    />
                  </svg>
                </a>
              </div>
              <div class="key-row">
                <input
                  id="apiKey"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="sk-..."
                />
                <button
                  id="toggleKey"
                  type="button"
                  class="icon-btn"
                  data-i18n-aria-label="showApiKey"
                  data-i18n-title="show"
                  aria-label="APIキーを表示"
                  aria-pressed="false"
                  title="表示"
                >
                  <svg
                    class="icon-eye"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="icon-eye-off"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M3 3l18 18" />
                    <path d="M10.6 10.6a3 3 0 1 0 4.2 4.2" />
                    <path
                      d="M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-2.1 3M6.7 6.8C4.6 8.2 3.1 10.1 2 12c0 0 3.5 7 10 7 1.9 0 3.5-.5 4.9-1.2"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <label class="field">
              <span class="field-label" data-i18n="model">モデル</span>
              <span class="select-wrap" data-custom-select>
                <select id="model">
                  <option value="gpt-5.6-sol">GPT-5.6 Sol</option>
                  <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
                  <option value="gpt-5.6-luna" selected>GPT-5.6 Luna</option>
                </select>
                <span class="chevron" aria-hidden="true"></span>
              </span>
            </label>

            <label class="field">
              <span class="field-label" data-i18n="voice">話者</span>
              <span class="select-wrap" data-custom-select>
                <select id="voice">
                  <option value="coral">Coral</option>
                  <option value="marin">Marin</option>
                  <option value="cedar">Cedar</option>
                  <option value="nova">Nova</option>
                  <option value="alloy">Alloy</option>
                  <option value="ash">Ash</option>
                  <option value="ballad">Ballad</option>
                  <option value="echo">Echo</option>
                  <option value="fable">Fable</option>
                  <option value="onyx">Onyx</option>
                  <option value="sage">Sage</option>
                  <option value="shimmer">Shimmer</option>
                  <option value="verse">Verse</option>
                </select>
                <span class="chevron" aria-hidden="true"></span>
              </span>
            </label>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="prompt" data-i18n="prompt"
                  >要約プロンプト</label
                >
                <button
                  id="resetPrompt"
                  type="button"
                  class="linkish"
                  data-i18n="resetPrompt"
                >
                  初期値に戻す
                </button>
              </div>
              <textarea
                id="prompt"
                rows="1"
                spellcheck="false"
                data-i18n-placeholder="promptPlaceholder"
                placeholder="要約の指示を入力"
              ></textarea>
            </div>
          </div>
        </details>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
